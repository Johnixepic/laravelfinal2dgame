<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phaser 4 Render Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: monospace;
        }
        #test-container {
            width: 960px;
            height: 600px;
            border: 2px solid #fff;
        }
        #debug {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-size: 12px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="test-container"></div>
    <div id="debug">Initializing...</div>

    <script type="module">
        import Phaser from 'phaser';

        const debug = document.getElementById('debug');

        // Test 1: Basic scene that renders shapes
        class TestScene extends Phaser.Scene {
            constructor() {
                super('TestScene');
                console.log('[TEST] Scene created');
                debug.textContent = 'Scene created';
            }

            create() {
                console.log('[TEST] Scene.create called');
                debug.textContent = 'Scene.create called';

                // Add a red rectangle
                this.add.rectangle(200, 300, 200, 200, 0xff0000);
                console.log('[TEST] Red rect added');

                // Add a green rectangle
                this.add.rectangle(400, 300, 200, 200, 0x00ff00);
                console.log('[TEST] Green rect added');

                // Add a blue rectangle
                this.add.rectangle(600, 300, 200, 200, 0x0000ff);
                console.log('[TEST] Blue rect added');

                // Add text
                this.add.text(480, 500, 'PHASER 4 WORKS!', {
                    fontSize: '32px',
                    color: '#ffffff'
                }).setOrigin(0.5);
                console.log('[TEST] Text added');

                debug.textContent = 'Shapes rendered! Check canvas.';
            }
        }

        // Create game
        const config = {
            type: Phaser.AUTO,
            parent: 'test-container',
            width: 960,
            height: 600,
            backgroundColor: '#18343b',
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
            },
            scene: [TestScene],
        };

        console.log('[TEST] Creating Phaser.Game...');
        debug.textContent = 'Creating game...';

        try {
            const game = new Phaser.Game(config);
            console.log('[TEST] Game created successfully');
            debug.textContent = 'Game created! Check canvas for colored rectangles.';

            game.events.on('ready', () => {
                console.log('[TEST] Game ready');
                debug.textContent = 'Game ready!';
            });

            game.events.on('destroy', () => {
                console.log('[TEST] Game destroyed');
            });
        } catch (e) {
            console.error('[TEST] ERROR creating game:', e);
            debug.textContent = 'ERROR: ' + e.message;
        }
    </script>
</body>
</html>

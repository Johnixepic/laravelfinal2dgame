<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#18343b">
    <title>THE LAST CONNECTION</title>
    <link rel="stylesheet" href="/build/assets/app-BhqopgXA.css">
    <script type="module" src="/build/assets/app-FmJEehdg.js"></script>
    
    
    
    

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: #101b1d;
            color: #edf3e9;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 22px;
            background: #172527;
            border-bottom: 1px solid #344646;
        }

        .game-header h1 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .game-header p {
            margin: 5px 0 0;
            color: #aabbb0;
            font-size: 12px;
        }

        .game-status {
            color: #c7d9b7;
            font-size: 12px;
            text-align: right;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-frame {
            width: min(1200px, 100%);
            overflow: hidden;
            border: 1px solid #43584d;
            border-radius: 8px;
            background: #18343b;
            box-shadow: 0 20px 70px #0007;
        }

        #game-container {
            width: 100%;
            height: min(72vh, 760px);
            min-height: 420px;
            overflow: hidden;
        }

        #game-container canvas {
            display: block;
        }

        .game-footer {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px 16px;
            background: #172527;
            border-top: 1px solid #344646;
            color: #afc0b4;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            main {
                padding: 8px;
            }

            #game-container {
                min-height: 360px;
                height: 65vh;
            }

            .game-header h1 {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header class="game-header">
        <div>
            <h1>THE LAST CONNECTION</h1>
            <p>A survival story begins at home.</p>
        </div>
        <div class="game-status">PROTOTYPE 0.1<br>DAY 01</div>
    </header>

    <main>
        <section class="game-frame" aria-label="Game area">
            <div id="game-container"></div>
            <div class="game-footer">
                <span>WASD / Arrow keys — Move</span>
                <span>Isometric Neighborhood — Development Build</span>
            </div>
        </section>
    </main>
</body>
</html>
